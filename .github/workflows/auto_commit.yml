name: Auto Contribution Bot

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day (adjust as needed)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run contribution script
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.log
          git diff-index --quiet HEAD || (git commit -m "Auto commit: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" && git push)
