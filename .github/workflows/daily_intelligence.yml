name: Ingest Daily AI Research

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run test suite
        run: |
          python -m unittest test_tracker.py

      - name: Run pipeline
        run: |
          python tracker.py

      - name: Commit dataset updates
        run: |
          git config --local user.name "Arif Alam"
          git config --local user.email "iamarifalam@users.noreply.github.com"
          git add data/ reports/
          git diff-index --quiet HEAD || (git commit -m "feat(data): update daily arXiv and Hugging Face index" && git push)
