name: Daily AI Research & Model Intelligence

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: |
          python -m unittest test_tracker.py

      - name: Run Intelligence Engine
        run: |
          python tracker.py

      - name: Commit Intelligence Digest & Datasets
        run: |
          git config --local user.name "Arif Alam"
          git config --local user.email "iamarifalam@users.noreply.github.com"
          git add data/ reports/
          git diff-index --quiet HEAD || (git commit -m "feat: sync daily research papers & benchmark models [$(date -u +'%Y-%m-%d')]" && git push)
